name: Cross-platform checks

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-and-cli:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python: ['3.10', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Validate source entry point
        run: python run.py --help
      - name: Validate sample configuration without network
        run: python run.py --config config.example.json validate
      - name: Build clean source archive
        run: python tools/package.py
      - name: Install project
        run: python -m pip install .
      - name: Validate installed entry point
        run: autodl-gpu-watch --version
